<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd"> <html><body> <h2 id="guatemala--a-town">Guatemala — A Town</h2> <p>Street color palettes, market patterns, and the texture of daily life—notes from a town that moved me.</p> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/guate1.JPG" sizes="95vw"></source> <img src="/assets/img/photos/guate1.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Volcano at the edge of morning—stone watching the first pots boil.</figcaption> </figure> </div> </div> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/guate2.JPG" sizes="95vw"></source> <img src="/assets/img/photos/guate2.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Painted walls breathe; laundry writes soft flags across the lane.</figcaption> </figure> </div> </div> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/guate3.JPG" sizes="95vw"></source> <img src="/assets/img/photos/guate3.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Market shadows; oranges bruise the light with sweetness.</figcaption> </figure> </div> </div> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/guate4.JPG" sizes="95vw"></source> <img src="/assets/img/photos/guate4.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Tin roofs keep quiet rain; a child counts dogs with a stick.</figcaption> </figure> </div> </div> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/guate5.JPG" sizes="95vw"></source> <img src="/assets/img/photos/guate5.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Buses in lacquered colors—saints of motion, loud and tender.</figcaption> </figure> </div> </div> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/guate6.JPG" sizes="95vw"></source> <img src="/assets/img/photos/guate6.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Hands weigh mangos by memory; coin and fruit keep rhythm.</figcaption> </figure> </div> </div> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/guate7.JPG" sizes="95vw"></source> <img src="/assets/img/photos/guate7.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Alley light thins to silk; bicycles wait like tame animals.</figcaption> </figure> </div> </div> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/guate8.JPG" sizes="95vw"></source> <img src="/assets/img/photos/guate8.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Corn smells like dusk; steam lifts a prayer into blue air.</figcaption> </figure> </div> </div> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/guate9.JPG" sizes="95vw"></source> <img src="/assets/img/photos/guate9.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Cobblestones remember every shoe; stories keep their shape.</figcaption> </figure> </div> </div> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/guate10.JPG" sizes="95vw"></source> <img src="/assets/img/photos/guate10.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Laundry maps the wind; a dog edits the street with its tail.</figcaption> </figure> </div> </div> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/guate11.JPG" sizes="95vw"></source> <img src="/assets/img/photos/guate11.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Tin cups, enamel bowls; the market speaks in metal vowels.</figcaption> </figure> </div> </div> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/guate12.JPG" sizes="95vw"></source> <img src="/assets/img/photos/guate12.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">A doorway holds its breath; someone hums behind a curtain.</figcaption> </figure> </div> </div> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/guate13-480.webp 480w,/assets/img/photos/guate13-800.webp 800w,/assets/img/photos/guate13-1400.webp 1400w," type="image/webp" sizes="95vw"></source> <img src="/assets/img/photos/guate13.jpeg" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Night gathers the town into lamps and low voices.</figcaption> </figure> </div> </div> <h2 id="puerto-varas">Puerto Varas</h2> <h2 id="dongbei-market--winter-morning">Dongbei Market — Winter Morning</h2> <p>Cold air, warm hands. Steam, salt, and the low hum of haggling.</p> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/market.JPG" sizes="95vw"></source> <img src="/assets/img/photos/market.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Steam lifts from buns; voices braid with the breath of morning.</figcaption> </figure> </div> </div> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/market2.JPG" sizes="95vw"></source> <img src="/assets/img/photos/market2.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Hands choose by weight and memory; winter greens, bright as bells.</figcaption> </figure> </div> </div> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/market3.JPG" sizes="95vw"></source> <img src="/assets/img/photos/market3.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Knives talk in quick rhythm; stalls speak in colors.</figcaption> </figure> </div> </div> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/market4.JPG" sizes="95vw"></source> <img src="/assets/img/photos/market4.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Fish silver the light; scales cling like snow to sleeves.</figcaption> </figure> </div> </div> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/market5.JPG" sizes="95vw"></source> <img src="/assets/img/photos/market5.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Numbers pass palm to palm; the day begins to taste like broth.</figcaption> </figure> </div> </div> <div class="row"> <div class="col-sm mt-3 mt-md-0"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photos/market6.JPG" sizes="95vw"></source> <img src="/assets/img/photos/market6.JPG" class="img-fluid rounded z-depth-1" width="100%" height="auto" loading="eager" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> <figcaption class="caption">Leaving with red bags and warm pockets; the cold is gentler now.</figcaption> </figure> </div> </div> <p>newyear.JPG</p> </body></html>
